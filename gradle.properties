# ide gradle settings (e.g. in android studio) override this file
# see http://www.gradle.org/docs/current/userguide/build_environment.html
org.gradle.jvmargs=-Xmx4096m -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configureondemand=true
kotlin.incremental=true
# see https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true
# gives each library its own r class scoped to its own resources
android.nonTransitiveRClass=true
# tensorflow-lite and tensorflow-lite-api share the org.tensorflow.lite namespace
# which agp 9 rejects by default so relax the unique namespace check
android.uniquePackageNames=false
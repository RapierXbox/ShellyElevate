name: Build and Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      prerelease:
        description: "Publish as a pre-release (only devices with pre-releases enabled pick it up)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-release-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # the action installs the obsolete `tools` package by default, which google
          # removed from the sdk repository: sdkmanager then fails the whole step.
          # everything actually needed is installed explicitly below
          packages: ''

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install Android platform/build-tools
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Prepare local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Ensure gradlew is executable
        run: chmod +x ./gradlew

      - name: Validate signing secrets
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          missing=()
          [ -z "$SIGNING_KEYSTORE_BASE64" ] && missing+=("SIGNING_KEYSTORE_BASE64")
          [ -z "$SIGNING_STORE_PASSWORD" ] && missing+=("SIGNING_STORE_PASSWORD")
          [ -z "$SIGNING_KEY_ALIAS" ] && missing+=("SIGNING_KEY_ALIAS")
          [ -z "$SIGNING_KEY_PASSWORD" ] && missing+=("SIGNING_KEY_PASSWORD")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required signing secrets: ${missing[*]}"
            exit 1
          fi

      # resolve the version once so the apk and the release tag can never drift apart
      - name: Resolve version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            # manual runs use the gradle date scheme
            VERSION="3.$(date +%y%j).$(date +%H%M)"
          fi
          echo "name=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          # the apk version must equal the release tag (see build.gradle.kts)
          SE_RELEASE_VERSION: ${{ steps.version.outputs.name }}
        run: ./gradlew clean :app:assembleRelease --no-daemon --stacktrace

      - name: Prepare APK for release
        run: |
          VERSION="${{ steps.version.outputs.name }}"
          VERSION=${VERSION#v}  # strip a leading v if present
          cp app/build/outputs/apk/release/*.apk "ShellyElevateV2-${VERSION}.apk"

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.name }}
          name: ${{ steps.version.outputs.name }}
          generate_release_notes: true
          # a pre-release keeps the same version scheme and is never marked as the latest release
          prerelease: ${{ inputs.prerelease == true }}
          make_latest: ${{ inputs.prerelease != true }}
          files: |
            ShellyElevateV2-*.apk